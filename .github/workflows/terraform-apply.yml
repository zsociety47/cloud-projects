# Reusable apply job. Pushes to main check, then apply.
# Pull requests cannot start this job if the caller uses on.push.
# Do not set a GitHub environment on the caller.

name: Terraform apply

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory that contains the Terraform root."
        type: string
        default: "."
      terraform_version:
        description: "Terraform version for hashicorp/setup-terraform."
        type: string
        default: "1.15.5"
      verify_script:
        description: "Path to the project's verify script, relative to the repository root."
        type: string
        default: "scripts/verify.sh"
      run_verify:
        description: "Run the verify script after apply."
        type: boolean
        default: true
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: apply-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check format
        run: terraform fmt -check -recursive

      - name: Initialize
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Apply
        run: terraform apply -input=false -auto-approve -no-color

      - name: Verify
        if: ${{ inputs.run_verify }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          script="${{ inputs.verify_script }}"
          if [[ ! -f "$script" ]]; then
            echo "No verify script at $script; skipping."
            exit 0
          fi
          chmod +x "$script"
          "$script"
